[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quality-gate"
version = "0.1.0"
description = "Offline quality gate for GTM signal-scoring and cold-email skills across model switches."
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = ["jsonschema>=4"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-p no:cacheprovider"
