# Settled settings for the Build 2 quality gate.
# Source: docs/spec.md ("Resolutions to open questions").
# Anything still to be measured is a FACT and lives in config/facts/*.toml,
# never here and never guessed. Read FACTs with Config.fact("<file>.<key>").

# Pinned arms. 02a: dateless 5.5 IDs are pinned snapshots; no dated ID exists.
[[arms]]
name = "haiku-5-5"
model = "claude-haiku-5-5"

[[arms]]
name = "sonnet-5-5"
model = "claude-sonnet-5-5"

[[arms]]
name = "opus-5-5"
model = "claude-opus-5-5"
# Opus runs only on the Opus subset (Resolution 8).
subset = "opus"

# Model-upgrade comparison arm (Haiku 4.5 -> Haiku 5.5). Pro availability is
# UNVERIFIED (02a section 2): enabled only when the pilot probe passes, i.e.
# FACT pilot.haiku_4_5_probe_passed == true. Otherwise the comparison is dropped
# and the README says so (Resolution 3).
[[candidate_arms]]
name = "haiku-4-5"
model = "claude-haiku-4-5-20251001"
enabled_by_fact = "pilot.haiku_4_5_probe_passed"

[run]
# Resolution 16: the CLI default effort, recorded and identical on every arm.
effort = "cli-default"
repeats = 2
# Drop or flag any run whose modelUsage keys are not exactly the arm's model (02a section 1).
require_model_usage_match = true

[budget]
# Research 02 budget rule.
max_weekly_fraction_low = 0.60
max_weekly_fraction_high = 0.70
max_five_hour_window_fraction = 0.80
rule = "Total eval usage <= 60-70% of the weekly limit and <= ~80% of any 5-hour window."

[fresh]
# Hand labels ignore a post's age (labelling guide, "Age"); the skill does not: its recency
# scores stop at 30-90 days and "Recency trumps everything". Each population is also reported
# on posts at most this many days old at collection, where the two definitions agree.
# Measured 2026-10-29: Sonnet's misses vs hand labels were mostly posts 100+ days old.
max_age_days = 90

[gift]
# Resolution 10.
window_days = 14
one_row_per_company = true
keep = "freshest qualifying post per company"
requires_hand_label = "signal_yes"
rank_by_arm = "sonnet-5-5"
rank_by_repeat = 1
tie_break = "recency"
top_n = 50
# Resolution 11: deterministic, no model.
why_now_template = '<role title> posted <N> days ago: "<evidence quote>"'
why_now_quote_max_words = 12
why_now_max_words = 20

[seeds]
natural_sample = 20261022
ambiguous_subset = 20261023
opus_subset = 20261024

[samples]
# Targets only; actual sizes are FACT pilot.natural_sample_size etc. (Resolution 4).
natural_target = 200
ambiguous_target_min = 60
ambiguous_target_max = 80
opus_subset_size = 50

[agreement]
# Resolution 6.
metric = "cohens_kappa"
gate_on = "signal_yes_no"
min_kappa = 0.80
report_only = ["signal_type"]

[thresholds]
# Resolution 5. Formulas as text; computed values are FACT thresholds.*.
macro_f1_drop = "Fail if macro-F1 vs hand labels drops by more than max(2 x measured repeat noise in F1, 3 points)."
flip_rate = "Fail if the flip rate between arms exceeds measured repeat noise + 5 points."
macro_f1_min_margin_points = 3
macro_f1_noise_multiple = 2
flip_rate_margin_points = 5
